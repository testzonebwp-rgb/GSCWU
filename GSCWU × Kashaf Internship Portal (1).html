<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSCWU × Kashaf Internship Portal</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f4;--card:#fff;--ink:#14231b;--mut:#5b6b62;--line:#d5dfd9;--g:#0b7a3b;--gd:#075a2b;--b:#2b3190;--r:#e63946;--hi:#e8f3ec}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--ink:#e8f0eb;--mut:#9bb0a3;--line:#2b3a31;--g:#3fb877;--gd:#2e9a60;--b:#8f95ff;--hi:#1d2c23}}
*,*:before,*:after{box-sizing:inherit}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:3px solid var(--g);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:54px;width:auto;border-radius:6px;background:#fff;padding:3px}header .x{font-size:22px;color:var(--mut)}
header h1{font:700 18px/1.2 Georgia,"Times New Roman",serif;margin:0}header p{margin:0;color:var(--mut);font-size:13px}
.sp{flex:1}main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font:700 20px Georgia,serif;margin:0 0 12px}h3{margin:0 0 8px;font-size:16px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{background:var(--g);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:600 14px inherit;cursor:pointer}
button:hover{background:var(--gd)}button.s{background:transparent;color:var(--g);border:1px solid var(--g)}button.d{background:var(--r)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--b);outline-offset:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--hi);font-size:13px}
.login{max-width:420px;margin:30px auto}.hint{font-size:12.5px;color:var(--mut);background:var(--hi);padding:8px 10px;border-radius:6px;margin-top:12px}
.err{color:var(--r);font-size:13px;min-height:18px}.ok{color:var(--g);font-weight:600}
.pa label{display:inline;margin-right:10px;color:var(--ink)}.pa input{width:auto}
.stat{font:700 26px Georgia,serif;color:var(--g)}
.paper{background:#fff;color:#111;border:1px solid #bbb;padding:34px;font-family:Georgia,serif;line-height:1.6}
.paper .lh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #0b7a3b;padding-bottom:10px;margin-bottom:18px}.paper .lh img{height:60px;border-radius:5px}
.cert{border:10px double #0b7a3b;text-align:center;padding:30px}.cert h1{font-size:34px;margin:10px 0;color:#075a2b}.cert .nm{font-size:30px;border-bottom:1px solid #333;display:inline-block;padding:0 24px;margin:8px 0}
.sig{display:flex;justify-content:space-between;margin-top:50px}.sig div{border-top:1px solid #333;padding-top:4px;min-width:150px;text-align:center;font-size:13px}
#pa{display:none}#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;overflow:auto;padding:env(safe-area-inset-top,0px) 12px 12px}.ovb{max-width:860px;margin:16px auto;background:var(--card);padding:12px;border-radius:10px}.ovb>p{position:sticky;top:0;background:var(--card);padding:6px 0;margin:0 0 8px;z-index:2}
@media print{#ov{display:none}body *{visibility:hidden}#pa,#pa *{visibility:visible}#pa{display:block;position:absolute;left:0;top:0;width:100%}}
</style></head><body>

<div><h1>Internship Attendance &amp; Evaluation Portal</h1><p>Government Sadiq College Women University, Bahawalpur · Kashaf Diagnostic Lab</p></div>
<span class="sp"></span><span id="who"></span><button class="s" id="out" style="display:none" onclick="logout()">Log out</button>
</header>
<main id="app"></main><div id="pa"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const K='gscwu_portal_v1',DOM={admin:'gscwu.edu.pk',hod:'hod.gscwu.edu.pk',teacher:'teachers.gscwu.edu.pk',student:'students.gscwu.edu.pk'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,me=null,tab='';
function seed(){return{users:[
{email:'admin@gscwu.edu.pk',pw:'admin123',role:'admin',name:'Administrator'},
{email:'ayesha@teachers.gscwu.edu.pk',pw:'teach123',role:'teacher',name:'Dr. Ayesha Khan'},
{email:'bsmlt01@students.gscwu.edu.pk',pw:'stud123',role:'student',name:'Fatima Noor',roll:'BS-MLT-01'},
{email:'bsmlt02@students.gscwu.edu.pk',pw:'stud123',role:'student',name:'Hira Siddiqui',roll:'BS-MLT-02'}],
att:{},tests:[],ia:{},docs:[]}}
try{db=JSON.parse(localStorage.getItem(K))}catch(e){}if(!db)db=seed();db.comments=db.comments||[];
let shared=null;const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}if(shared)shared.set({json:JSON.stringify(db)}).catch(()=>{})};
const studs=()=>db.users.filter(u=>u.role==='student'),byE=e=>db.users.find(u=>u.email===e)||{name:e};
const today=()=>new Date().toISOString().slice(0,10);
function attPct(e){const d=Object.values(db.att).filter(x=>x[e]);if(!d.length)return null;return Math.round(d.filter(x=>x[e]!=='A').length/d.length*100)}
function testPct(e){const t=db.tests.filter(x=>x.marks[e]!==undefined&&x.marks[e]!=='');if(!t.length)return null;return Math.round(t.reduce((a,x)=>a+x.marks[e]/x.total*100,0)/t.length)}
const iaTot=e=>{const a=db.ia[e];return a?(+a.punct+ +a.perf+ +a.conduct+ +a.skills):null};
const f=v=>v===null?'—':v;
function show(){const a=$('#app');$('#out').style.display=me?'':'none';$('#who').textContent=me?me.name+' ('+me.role+')':'';
if(!me){login(a);return}
const T={admin:['Overview','Users','Letters','Experience','Comments'],hod:['Progress','Comments'],teacher:['Attendance','Tests','Assessment','Complaint','Certificate','Experience','Overview','Comments'],student:['My record','My documents','Comments']}[me.role].concat('Account');
if(!T.includes(tab))tab=T[0];
a.innerHTML='<div class="tabs">'+T.map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';show()">${t}</button>`).join('')+'</div><div id="v"></div>';
V[tab]($('#v'))}
function login(a){a.innerHTML=`<div class="card login"><h2>Sign in</h2>
<label for="r">Account type</label><select id="r" onchange="hint()"><option value="student">Student intern</option><option value="teacher">Teacher / supervisor</option><option value="admin">Admin</option><option value="hod">Head of Department (HOD)</option></select>
<label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<p class="err" id="er"></p><button onclick="doLogin()">Sign in</button><div class="hint" id="h"></div></div>`;hint()}
function hint(){const r=$('#r').value;
$('#h').innerHTML='Email must end with <b>@'+DOM[r]+'</b>'}
function doLogin(){const r=$('#r').value,e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;
if(!e.endsWith('@'+DOM[r])){$('#er').textContent='Use your @'+DOM[r]+' email for this account type.';return}
const u=db.users.find(x=>x.email===e&&x.pw===p&&x.role===r);if(!u){$('#er').textContent='Email or password is incorrect.';return}me=u;tab='';show()}
function logout(){me=null;show()}
function opts(sel){return studs().map(s=>`<option value="${esc(s.email)}" ${s.email===sel?'selected':''}>${esc(s.name)} (${esc(s.roll||'')})</option>`).join('')}
const noS='<p>No students yet. Ask the admin to add student accounts.</p>';
const V={
Overview(el){el.innerHTML=`<div class="card"><h2>Intern summary</h2><p><button class="s" onclick="exportCSV()">Download report (CSV)</button></p><div class="w"><table><tr><th>Roll no.</th><th>Name</th><th>Attendance</th><th>Avg. test %</th><th>Internal assessment /40</th></tr>
${studs().map(s=>`<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${f(attPct(s.email))}${attPct(s.email)===null?'':'%'}</td><td>${f(testPct(s.email))}${testPct(s.email)===null?'':'%'}</td><td>${f(iaTot(s.email))}</td></tr>`).join('')}</table></div></div>
<div class="grid"><div class="card"><div class="stat">${studs().length}</div>Students</div><div class="card"><div class="stat">${Object.keys(db.att).length}</div>Days recorded</div><div class="card"><div class="stat">${db.tests.length}</div>Tests held</div><div class="card"><div class="stat">${db.docs.length}</div>Letters &amp; certificates</div></div>`},
Users(el){el.innerHTML=`<div class="card"><h2>Add account</h2><div class="grid">
<div><label>Type</label><select id="nr"><option value="student">Student</option><option value="teacher">Teacher</option><option value="hod">HOD</option></select></div>
<div><label>Full name</label><input id="nn"></div><div><label>Roll no. (students)</label><input id="nl"></div>
<div><label>Email username</label><input id="ne" placeholder="e.g. bsmlt03"></div><div><label>Password</label><input id="np"></div></div>
<p class="err" id="er"></p><button onclick="addUser()">Add account</button></div>
<div class="card"><h2>Reset a password</h2><div class="grid"><div><label>Account</label><select id="rs">${db.users.map((u,i)=>`<option value="${i}">${esc(u.name)} (${esc(u.email)})</option>`).join('')}</select></div><div><label>New password</label><input id="rp"></div></div><p class="err" id="er2"></p><button onclick="resetPw()">Reset password</button></div><div class="card"><h2>Accounts</h2><div class="w"><table><tr><th>Name</th><th>Type</th><th>Email</th><th></th></tr>${db.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${u.role}</td><td>${esc(u.email)}</td><td>${u.role==='admin'?'':`<button class="d" onclick="two(this,()=>delUser(${i}))">Remove</button>`}</td></tr>`).join('')}</table></div></div>`},
Attendance(el){const d=window._ad||today(),cur=db.att[d]||{};
el.innerHTML=`<div class="card"><h2>Daily attendance</h2><label for="ad">Date</label><input id="ad" type="date" value="${d}" onchange="window._ad=this.value;show()" style="max-width:200px">
${studs().length?`<div class="w"><table><tr><th>Student</th><th>Status</th></tr>${studs().map(s=>`<tr><td>${esc(s.name)}<br><small>${esc(s.roll)}</small></td><td class="pa">${[['P','Present'],['L','Late'],['A','Absent']].map(([v,n])=>`<label><input type="radio" name="a_${esc(s.email)}" value="${v}" ${(cur[s.email]||'P')===v?'checked':''}>${n}</label>`).join('')}</td></tr>`).join('')}</table></div><p><button onclick="saveAtt()">Save attendance</button> <span id="ms" class="ok"></span></p>`:noS}</div>`},
Tests(el){el.innerHTML=`<div class="card"><h2>New test</h2><div class="grid"><div><label>Test name</label><input id="tn" placeholder="e.g. Hematology quiz 1"></div><div><label>Total marks</label><input id="tt" type="number" min="1" value="20"></div><div><label>Date</label><input id="td" type="date" value="${today()}"></div></div>
${studs().length?`<div class="w"><table><tr><th>Student</th><th>Marks obtained</th></tr>${studs().map(s=>`<tr><td>${esc(s.name)}</td><td><input type="number" min="0" class="tm" data-e="${esc(s.email)}" style="max-width:110px"></td></tr>`).join('')}</table></div>`:noS}
<p class="err" id="er"></p><button onclick="saveTest()">Save test</button></div>
<div class="card"><h2>Recorded tests</h2>${db.tests.length?db.tests.map((t,i)=>`<h3>${esc(t.name)} · ${t.date} · /${t.total} <button class="d" onclick="two(this,()=>delTest(${i}))">Delete</button></h3><p>${Object.entries(t.marks).map(([e,m])=>esc(byE(e).name)+': <b>'+esc(m)+'</b>').join(' &nbsp;|&nbsp; ')}</p>`).join(''):'<p>No tests recorded yet.</p>'}</div>`},
Assessment(el){const s=window._is||(studs()[0]||{}).email,a=db.ia[s]||{};
const fld=(k,n)=>`<div><label>${n} (0–10)</label><input type="number" id="i_${k}" min="0" max="10" value="${a[k]??''}"></div>`;
el.innerHTML=`<div class="card"><h2>Internal assessment</h2>${studs().length?`<label>Student</label><select id="is" onchange="window._is=this.value;show()">${opts(s)}</select>
<div class="grid">${fld('punct','Punctuality')}${fld('perf','Lab performance')}${fld('conduct','Professional conduct')}${fld('skills','Technical skills')}</div>
<label>Remarks</label><textarea id="i_rem" rows="3">${esc(a.rem||'')}</textarea><p class="err" id="er"></p><button onclick="saveIA()">Save assessment</button>`:noS}</div>
<div class="card"><div class="w"><table><tr><th>Student</th><th>Total /40</th><th>Remarks</th></tr>${studs().map(x=>`<tr><td>${esc(x.name)}</td><td>${f(iaTot(x.email))}</td><td>${esc((db.ia[x.email]||{}).rem||'')}</td></tr>`).join('')}</table></div></div>`},
Complaint(el){el.innerHTML=`<div class="card"><h2>Complaint letter</h2>${studs().length?`<div class="grid"><div><label>Student</label><select id="cs">${opts()}</select></div>
<div><label>Issue</label><select id="ct"><option>Late arrival</option><option>Repeated absence</option><option>Unprofessional conduct</option><option>Non-compliance with lab rules</option><option>Poor performance</option></select></div>
<div><label>Incident date</label><input type="date" id="cd" value="${today()}"></div></div><label>Details</label><textarea id="cx" rows="4"></textarea>
<p class="err" id="er"></p><button onclick="gen('complaint')">Generate letter</button>`:noS}</div><div id="pv"></div>`},
Certificate(el){el.innerHTML=`<div class="card"><h2>Appreciation certificate</h2>${studs().length?`<div class="grid"><div><label>Student</label><select id="cs">${opts()}</select></div>
<div><label>Appreciated for</label><select id="ct"><option>Outstanding performance</option><option>Excellent attendance</option><option>Exemplary conduct</option><option>Best technical skills</option></select></div>
<div><label>Date</label><input type="date" id="cd" value="${today()}"></div></div><label>Citation (optional)</label><textarea id="cx" rows="3"></textarea>
<p class="err" id="er"></p><button onclick="gen('certificate')">Generate certificate</button>`:noS}</div><div id="pv"></div>`},
Experience(el){const inp=(i,l,v,t)=>`<div><label for="${i}">${l}</label><input id="${i}" type="${t||'text'}" value="${esc(v||'')}"></div>`;

function addUser(){const r=$('#nr').value,n=$('#nn').value.trim(),u=$('#ne').value.trim().toLowerCase(),p=$('#np').value;
if(!n||!u||!p){$('#er').textContent='Fill in name, email username and password.';return}
const em=u+'@'+DOM[r];if(db.users.some(x=>x.email===em)){$('#er').textContent='That email already exists.';return}
db.users.push({email:em,pw:p,role:r,name:n,roll:$('#nl').value.trim()});save();show()}
function genExp(){const g=n=>$(n).value.trim(),a=g('#xa'),b=g('#xb');if(!$('#xs').value||!a||!b){$('#er').textContent='Choose a student and enter the start and end dates.';return}if(b<a){$('#er').textContent='End date cannot be before the start date.';return}
const d={type:'experience',to:$('#xs').value,title:'Experience certificate',g:$('#xg').value,start:a,end:b,days:g('#xd')||wd(a,b),obj:$('#xo').value,perf:$('#xp').value,trainer:g('#xt'),trainerRole:g('#xr'),director:g('#xdn'),directorRole:g('#xdr'),date:g('#xi')||today(),by:me.name};db.docs.push(d);save();pv(d)}
function addCm(){const t=$('#mt').value.trim(),to=$('#mc').value;if(!to||!t){$('#er').textContent='Choose a student and write a comment.';return}db.comments=db.comments||[];db.comments.push({to,text:t,by:me.name,byRole:me.role,date:today()});save();show()}
function delCm(i){db.comments.splice(i,1);save();show()}
function two(b,fn){if(b.dataset.s){fn();return}b.dataset.s=1;b.textContent='Click again to confirm';setTimeout(()=>{delete b.dataset.s;b.textContent='Remove'},4000)}
function delUser(i){db.users.splice(i,1);save();show()}
function resetPw(){const p=$('#rp').value;if(p.length<6){$('#er2').textContent='Use at least 6 characters.';return}db.users[+$('#rs').value].pw=p;save();$('#er2').innerHTML='<span class="ok">Password reset.</span>'}
function changePw(){const n=$('#pn').value;if($('#po').value!==me.pw){$('#er').textContent='Current password is incorrect.';return}if(n.length<6){$('#er').textContent='Use at least 6 characters.';return}me.pw=n;save();$('#er').innerHTML='<span class="ok">Password updated.</span>'}
async function exportCSV(){const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};const r=[['Roll no.','Name','Attendance %','Avg test %','Internal /40']].concat(studs().map(s=>[s.roll,s.name,f(attPct(s.email)),f(testPct(s.email)),f(iaTot(s.email))]));try{const d=window.claude&&await claude.use('downloads');if(!d){alert('Download is not available in this view.');return}await d.save({filename:'internship-report.csv',data:'\ufeff'+r.map(x=>x.map(q).join(',')).join('\n')})}catch(e){}}
function saveAtt(){const d=$('#ad').value,o={};studs().forEach(s=>{const c=document.querySelector(`input[name="a_${s.email}"]:checked`);o[s.email]=c?c.value:'P'});db.att[d]=o;save();$('#ms').textContent='Saved for '+d}
function saveTest(){const n=$('#tn').value.trim(),t=+$('#tt').value,m={};
document.querySelectorAll('.tm').forEach(i=>{if(i.value!=='')m[i.dataset.e]=+i.value});
if(!n||!t){$('#er').textContent='Enter a test name and total marks.';return}
if(Object.values(m).some(x=>x>t||x<0)){$('#er').textContent='Marks cannot exceed the total or be negative.';return}
db.tests.push({name:n,total:t,date:$('#td').value,marks:m});save();show()}
function delTest(i){db.tests.splice(i,1);save();show()}

db.ia[s]=o;save();$('#er').innerHTML='<span class="ok">Saved.</span>'}

function wd(a,b){let n=0;for(let d=new Date(a),e=new Date(b);d<=e;d.setDate(d.getDate()+1))if(d.getDay()!==0)n++;return n}
function renderExp(d,s){const f=d.g!=='m',P=f?['Miss','she','her','her']:['Mr.','he','his','him'],C=w=>w[0].toUpperCase()+w.slice(1);
return`<div class="paper">${LH}<h2 style="text-align:center;letter-spacing:1px;margin:6px 0 14px">EXPERIENCE CERTIFICATE</h2><p>This is to certify that ${P[0]} <b>${esc(s.name)}</b>${s.roll?' (Roll No. '+esc(s.roll)+')':''}, a student of Government Sadiq College Women University, Bahawalpur, has successfully completed ${P[2]} internship at Kashaf Diagnostic Lab, Bahawalpur, at the request of the university. ${C(P[2])} tenure was <b>${esc(d.days)} working days</b>, from ${nice(d.start)} to ${nice(d.end)}.</p><p style="margin-bottom:4px"><b>Main objectives of learning:</b></p><ul style="margin:0 0 10px;padding-left:22px;font-size:14px;line-height:1.45">${d.obj.split('\n').filter(x=>x.trim()).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>During ${P[2]} internship, ${P[1]} showed dedication, and ${P[2]} performance and responsibilities were <b>${esc(d.perf)}</b>. ${C(P[1])} demonstrated a willingness to learn and a strong sense of responsibility in carrying out assigned tasks.</p><p>We wish ${P[3]} success in ${P[2]} future endeavours.</p><p>Dated: ${nice(d.date)}</p><div class="sig"><div><b>${esc(d.trainer)}</b><br>${esc(d.trainerRole)}<br>Kashaf Diagnostic Lab, Bahawalpur</div><div><b>${esc(d.director)}</b><br>${esc(d.directorRole)}<br>Kashaf Diagnostic Lab, Bahawalpur</div></div><p style="font-size:12px;margin-top:22px;color:#444">For further information, please contact: info@kashaflab.com, kashaflab2020@gmail.com</p></div>`}
function render(d){const s=byE(d.to);
if(d.type==='experience')return renderExp(d,s);
if(d.type==='complaint')return`<div class="paper">${LH}<p>Date: ${nice(d.date)}</p><p>To,<br><b>${esc(s.name)}</b> (${esc(s.roll||'')})<br>Student Intern</p><p><b>Subject: Complaint regarding ${esc(d.title.toLowerCase())}</b></p>
<p>Dear ${esc(s.name)},</p><p>It has been brought to my notice that on ${nice(d.idate)} the following concern was observed during your internship: <b>${esc(d.title)}</b>.</p><p>${esc(d.text)||'Details were shared verbally.'}</p>
<p>You are advised to correct this behaviour immediately. Repeated incidents may affect your internal assessment and internship completion.</p><div class="sig"><div>${esc(d.by)}<br>Supervisor</div><div>Intern’s acknowledgement</div></div></div>`;
return`<div class="paper cert">${LH.replace('class="lh"','class="lh" style="text-align:left"')}<h1>Certificate of Appreciation</h1><p dir="rtl" lang="ur" style="font-size:24px;margin:0">سندِ تحسین</p><p>This certificate is proudly presented to</p><div class="nm">${esc(s.name)}</div><p>${esc(s.roll||'')}</p>
<p>in recognition of <b>${esc(d.title.toLowerCase())}</b> during the internship at Kashaf Diagnostic Lab.</p><p>${esc(d.text)}</p><p>${nice(d.date)}</p><div class="sig"><div>${esc(d.by)}<br>Supervisor</div><div>Director, Kashaf Diagnostic Lab</div></div></div>`}
function gen(type){const d={type,to:$('#cs').value,title:$('#ct').value,idate:$('#cd').value,date:$('#cd').value,text:$('#cx').value.trim(),by:me.name};
if(!d.to){$('#er').textContent='Choose a student.';return}
if(type==='complaint'&&!d.text){$('#er').textContent='Add details of the incident.';return}
db.docs.push(d);save();pv(d)}
function view(i){pv(db.docs[i])}
let cur=null;const pm=()=>[...document.querySelectorAll('.pmsg')].pop();
function btns(o){return '<p style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+(o?'<button class="s" onclick="closePrev()">Close preview</button>':'<button onclick="openPrev()">Preview</button>')+'<button onclick="doPrint()">Print</button><button class="s" onclick="dlPDF()">Download PDF</button><span class="pmsg ok"></span></p>'}
function pv(d){cur=d;$('#pv').innerHTML=btns(0)+render(d);$('#pa').innerHTML=render(d);$('#pv').scrollIntoView()}
function openPrev(){if(!cur)return;closePrev();const o=document.createElement('div');o.id='ov';o.setAttribute('role','dialog');o.setAttribute('aria-label','Document preview');o.innerHTML='<div class="ovb">'+btns(1)+render(cur)+'</div>';document.body.appendChild(o);document.body.style.overflow='hidden'}
function closePrev(){const o=$('#ov');if(o)o.remove();document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePrev()});
function doPrint(){const m=pm();try{window.print()}catch(e){}setTimeout(()=>{if(m&&!m.textContent)m.textContent='If no print window opened, use Download PDF.'},900)}
async function dlPDF(){const el=document.querySelector('#ov .paper')||document.querySelector('#pv .paper'),m=pm(),say=t=>{m.textContent=t};if(!el)return;
if(!window.html2canvas||!window.jspdf){say('PDF tools could not load. Check your internet connection and try again.');return}
say('Preparing PDF\u2026');let blob;const cert=el.classList.contains('cert');
try{const c=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}),{jsPDF}=window.jspdf,p=new jsPDF({orientation:cert?'l':'p',unit:'mm',format:'a4'}),pw=p.internal.pageSize.getWidth(),ph=p.internal.pageSize.getHeight();let w=pw-16,h=c.height*w/c.width;if(h>ph-16){h=ph-16;w=c.width*h/c.height}
p.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',(pw-w)/2,8,w,h);blob=p.output('blob')}catch(e){say('Could not build the PDF: '+((e&&e.message)||e));return}
const fn=(cert?'certificate':'document')+'-'+today()+'.pdf';
try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:fn,data:blob});say('PDF saved.');return}}catch(e){}
